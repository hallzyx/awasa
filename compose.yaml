services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-Propietario}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      DB_HOST: db
      DB_NAME: sbg_upc
      DB_USER: sbg_upc
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:-}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(res=>{if(!res.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 25s
      retries: 3
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sbg_upc
      MARIADB_USER: sbg_upc
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
volumes:
  db_data:
